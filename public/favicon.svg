<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Dark obsidian slate background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151F" />
      <stop offset="100%" stop-color="#07070A" />
    </linearGradient>

    <!-- Peak highlight gradient (Expedition Yellow / Amber) -->
    <linearGradient id="peakSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF385" />
      <stop offset="40%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Peak shadow gradient -->
    <linearGradient id="peakShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="65%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Distant mountain gradient -->
    <linearGradient id="distantPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Foreground ridge gradient -->
    <linearGradient id="frontRidgeLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Base background with rounded corners -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" />

  <!-- Iconic Expedition Yellow Magazine Frame (Border) -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="11.5" stroke="#FFCC00" stroke-width="2.5" fill="none" opacity="0.95" />

  <!-- Background subtle topographical contour rings -->
  <g opacity="0.25" stroke="#FFCC00" stroke-width="0.8" fill="none">
    <ellipse cx="32" cy="46" rx="20" ry="7" />
    <ellipse cx="32" cy="50" rx="24" ry="8" stroke-dasharray="2,2" />
  </g>

  <!-- Distant Background Mountain Peak -->
  <polygon points="14,48 24,25 35,48" fill="url(#distantPeak)" opacity="0.7" />
  <polygon points="24,25 28,33 35,48 24,48" fill="#0F172A" opacity="0.85" />

  <!-- Main 3D Mountain Peak (Center-Right) -->
  <!-- Lit facet (left) -->
  <polygon points="17,47 33,13 34,47" fill="url(#peakSun)" />
  <!-- Shaded facet (right) -->
  <polygon points="33,13 49,47 34,47" fill="url(#peakShadow)" />

  <!-- Snowcap highlight on summit -->
  <polygon points="33,13 29,21 33,19 37,22" fill="#FFFFFF" opacity="0.95" />

  <!-- Foreground Blue Glacial / Fluvial Ridge (Left) -->
  <polygon points="9,50 21,34 31,50" fill="url(#frontRidgeLit)" opacity="0.9" />
  <polygon points="21,34 31,50 25,50" fill="#0369A1" opacity="0.95" />

  <!-- Topographic Elevation Isolines over base -->
  <path d="M11,48 Q32,41 53,48" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
  <path d="M7,52 Q32,46 57,52" stroke="#FFCC00" stroke-width="1.8" stroke-linecap="round" opacity="0.95" />
  <path d="M13,56 Q32,51 51,56" stroke="#FFCC00" stroke-width="1" stroke-linecap="round" opacity="0.55" />

  <!-- Exploration 4-point Compass / North Star in Top Right -->
  <g transform="translate(47, 16)">
    <!-- Subtle glow behind star -->
    <circle cx="0" cy="0" r="3" fill="#FFCC00" opacity="0.3" />
    <path d="M0,-6 L1.2,-1.2 L6,0 L1.2,1.2 L0,6 L-1.2,1.2 L-6,0 L-1.2,-1.2 Z" fill="#FFCC00" />
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF" />
  </g>
</svg>
